name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run lint
      - run: bun run build
      - name: Check reproducible build
        if: matrix.os == 'ubuntu-latest'
        run: |
          sha256sum dist/larecode > /tmp/larecode.sha
          bun run build
          sha256sum -c /tmp/larecode.sha

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile
      - run: node node_modules/typescript/bin/tsc --noEmit
      - run: bun run test:coverage

  perf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile
      - run: bun run test:perf

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun packages/cli/src/index.ts --version

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile
      - run: bun audit --audit-level=high --ignore GHSA-75px-5xx7-5xc7 --ignore GHSA-jvwf-75h9-cwgg --ignore GHSA-685m-2w69-288q --ignore GHSA-xq3m-2v4x-88gg --ignore GHSA-wcpc-wj8m-hjx6 --ignore GHSA-f88m-g3jw-g9cj --ignore GHSA-rgj7-g3m4-5g8c --ignore GHSA-wq5f-xc86-pv8c --ignore GHSA-66ff-xgx4-vchm
      - run: bun run test:security

  tmux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - run: bun install --frozen-lockfile
      - run: bun run test:tmux
