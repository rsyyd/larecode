name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-linux-x64
            asset: larecode-linux-x64
            os: linux
            cpu: x64
          - target: bun-linux-arm64
            asset: larecode-linux-arm64
            os: linux
            cpu: arm64
          - target: bun-darwin-x64
            asset: larecode-darwin-x64
            os: darwin
            cpu: x64
          - target: bun-darwin-arm64
            asset: larecode-darwin-arm64
            os: darwin
            cpu: arm64
          - target: bun-windows-x64
            asset: larecode-windows-x64.exe
            os: win32
            cpu: x64
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile --os=${{ matrix.os }} --cpu=${{ matrix.cpu }}
      - name: Build ${{ matrix.asset }}
        run: bun build --compile --target=${{ matrix.target }} --outfile dist/${{ matrix.asset }} packages/cli/src/index.ts
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --title "$GITHUB_REF_NAME" --generate-notes
      - name: Generate packaging manifests
        run: bun run scripts/packaging.ts --version "${GITHUB_REF_NAME#v}" --binaries artifacts --out packaging/out
      - name: Generate checksums
        run: sha256sum artifacts/* | sed 's|artifacts/||' > packaging/out/checksums.txt
      - name: Upload packaging manifests
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" packaging/out/*

  npm:
    needs: publish
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - name: Build npm bundle
        run: bun run build:npm
      - name: Set version from tag
        run: npm pkg set version="${GITHUB_REF_NAME#v}"
        working-directory: npm
      - name: Publish to npm
        if: env.NPM_TOKEN != ''
        run: npm publish
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}

  manifests:
    needs: publish
    runs-on: ubuntu-latest
    env:
      PACKAGING_SSH_KEY_TAP: ${{ secrets.PACKAGING_SSH_KEY_TAP }}
      PACKAGING_SSH_KEY_BUCKET: ${{ secrets.PACKAGING_SSH_KEY_BUCKET }}
    steps:
      - name: Skip without deploy keys
        if: env.PACKAGING_SSH_KEY_TAP == '' || env.PACKAGING_SSH_KEY_BUCKET == ''
        run: echo "Deploy keys are not set; the tap and bucket stay unchanged."
      - name: Write deploy keys
        if: env.PACKAGING_SSH_KEY_TAP != '' && env.PACKAGING_SSH_KEY_BUCKET != ''
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/tap_key"
          printf '%s\n' "$PACKAGING_SSH_KEY_TAP" > "$RUNNER_TEMP/tap_key"
          install -m 600 /dev/null "$RUNNER_TEMP/bucket_key"
          printf '%s\n' "$PACKAGING_SSH_KEY_BUCKET" > "$RUNNER_TEMP/bucket_key"
      - name: Download generated manifests
        if: env.PACKAGING_SSH_KEY_TAP != '' && env.PACKAGING_SSH_KEY_BUCKET != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p packaging/out
          gh release download "$GITHUB_REF_NAME" --pattern larecode.rb --pattern larecode.json --dir packaging/out
      - name: Push the formula to the tap
        if: env.PACKAGING_SSH_KEY_TAP != '' && env.PACKAGING_SSH_KEY_BUCKET != ''
        run: |
          export GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/tap_key -o StrictHostKeyChecking=accept-new"
          git clone --depth 1 git@github.com:rsyyd/homebrew-larecode.git tap
          mkdir -p tap/Formula
          cp packaging/out/larecode.rb tap/Formula/larecode.rb
          cd tap
          git config user.name larecode-release
          git config user.email releases@users.noreply.github.com
          git add -A
          git diff --cached --quiet || git commit -m "larecode ${GITHUB_REF_NAME#v}"
          git push
      - name: Push the manifest to the bucket
        if: env.PACKAGING_SSH_KEY_TAP != '' && env.PACKAGING_SSH_KEY_BUCKET != ''
        run: |
          export GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/bucket_key -o StrictHostKeyChecking=accept-new"
          git clone --depth 1 git@github.com:rsyyd/larecode-scoop.git bucket
          cp packaging/out/larecode.json bucket/larecode.json
          cd bucket
          git config user.name larecode-release
          git config user.email releases@users.noreply.github.com
          git add -A
          git diff --cached --quiet || git commit -m "larecode ${GITHUB_REF_NAME#v}"
          git push
