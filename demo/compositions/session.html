      tl.from('#caption', { opacity: 0, y: 12, duration: 0.5, ease: 'power2.out' }, 5.5);
      tl.to('#caption', { opacity: 0, duration: 0.45 }, 8.7);
      tl.to('#window', { opacity: 0, y: -30, duration: 0.5, ease: 'power2.in' }, 18.3);
