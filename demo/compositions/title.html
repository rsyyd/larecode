<template id="title-template">
  <div data-composition-id="title" data-width="1920" data-height="1080">
    <div id="title-word" class="clip" data-start="0" data-duration="3.4" data-track-index="1">
      Lare Code
    </div>
    <div id="title-bar" class="clip" data-start="0" data-duration="3.4" data-track-index="1"></div>
    <div id="title-sub" class="clip" data-start="0" data-duration="3.4" data-track-index="1">
      An open-source coding agent for your terminal
    </div>
    <div id="title-foot" class="clip" data-start="0" data-duration="3.4" data-track-index="1">
      <span>runs locally</span> · <span>any OpenAI-compatible provider</span> ·
      <span>no telemetry</span>
    </div>

    <style>
      [data-composition-id='title'] .clip {
        position: absolute;
      }
      [data-composition-id='title'] #title-word {
        top: 372px;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 104px;
        font-weight: 700;
        letter-spacing: -2px;
      }
      [data-composition-id='title'] #title-bar {
        top: 512px;
        left: 0;
        right: 0;
        margin: auto;
        width: 88px;
        height: 8px;
        border-radius: 4px;
        background: #5c9cf5;
      }
      [data-composition-id='title'] #title-sub {
        top: 556px;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 34px;
        font-weight: 400;
        color: #808080;
      }
      [data-composition-id='title'] #title-foot {
        top: 640px;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 22px;
        font-weight: 400;
        color: #6a6a6a;
        letter-spacing: 1px;
      }
      [data-composition-id='title'] #title-foot span {
        color: #9a9a9a;
      }
    </style>

    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines.title = tl;

      tl.from('#title-word', { opacity: 0, y: 36, duration: 0.9, ease: 'power3.out' }, 0.2);
      tl.from('#title-bar', { scaleX: 0, duration: 0.7, ease: 'power3.out' }, 1.0);
      tl.from('#title-sub', { opacity: 0, y: 18, duration: 0.7, ease: 'power3.out' }, 1.3);
      tl.from('#title-foot', { opacity: 0, duration: 0.6 }, 1.8);
      tl.to(
        ['#title-word', '#title-bar', '#title-sub', '#title-foot'],
        { opacity: 0, duration: 0.4 },
        3.0
      );
    </script>
  </div>
</template>
